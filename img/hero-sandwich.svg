    <circle cx="770" cy="200" r="5"/><circle cx="800" cy="230" r="4"/><circle cx="750" cy="240" r="3"/>
    <circle cx="110" cy="700" r="5"/><circle cx="90" cy="670" r="3"/>
    <circle cx="800" cy="680" r="5"/><circle cx="820" cy="650" r="4"/>
  </g>
  <!-- bottom bun -->
