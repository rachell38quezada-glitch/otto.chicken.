  <circle cx="330" cy="540" r="16" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="6"/>
  <circle cx="450" cy="556" r="16" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="6"/>
  <circle cx="570" cy="540" r="16" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="6"/>
