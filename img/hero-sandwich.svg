  <g fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3">
    <ellipse cx="360" cy="300" rx="12" ry="6" transform="rotate(-20 360 300)"/>
    <ellipse cx="420" cy="264" rx="12" ry="6" transform="rotate(-8 420 264)"/>
    <ellipse cx="480" cy="256" rx="12" ry="6"/>
    <ellipse cx="540" cy="264" rx="12" ry="6" transform="rotate(10 540 264)"/>
    <ellipse cx="590" cy="300" rx="12" ry="6" transform="rotate(20 590 300)"/>
  </g>
  <path d="M214 384 h472" stroke="#0A0A0A" stroke-width="13"/>
