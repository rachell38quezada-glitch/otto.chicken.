    <circle cx="490" cy="432" r="7"/><circle cx="570" cy="460" r="8"/><circle cx="620" cy="480" r="6"/>
    <circle cx="300" cy="490" r="6"/><circle cx="600" cy="490" r="6"/><circle cx="450" cy="480" r="7"/>
  </g>
  <!-- cheese drip -->
  <path d="M176 430 q262 56 528 0 l-16 42 q-20 30 -44 4 q-20 30 -46 0 q-20 30 -46 0 q-20 30 -46 0 q-20 30 -46 0 q-20 30 -46 0 q-20 30 -44 -4 z" fill="#FFD328" stroke="#0A0A0A" stroke-width="10" stroke-linejoin="round"/>
  <!-- lettuce -->
  <path d="M182 412 q22 -30 52 -8 q18 -34 48 -12 q18 -34 48 -8 q18 -30 48 -4 q18 -28 48 0 q18 -28 48 4 q18 -30 48 8 q18 -34 48 12 q24 -22 52 8 l-10 40 q-250 46 -500 0 z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="10" stroke-linejoin="round"/>
