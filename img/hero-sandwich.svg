  <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M320 220 q-16 -40 10 -70 q26 -30 6 -66"/>
    <path d="M450 210 q-16 -40 10 -70 q26 -30 6 -66"/>
    <path d="M580 220 q-16 -40 10 -70 q26 -30 6 -66"/>
